name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting RUSTFLAGS here. `-C target-cpu=native` would be wrong
  # (the runner is a different machine than the one benchmarks are measured on), and a
  # global `-D warnings` would also promote *dependency* warnings to errors. Warnings
  # are denied per-invocation on our own crates instead, via the clippy step below.

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Must match the `channel` in rust-toolchain.toml, otherwise the toolchain gets
      # installed twice: once by this action and once by rustup honouring that file.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Toolchain
        run: rustc -V && cargo -V && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  # Added in phase 2: builds a small index on `siftsmall` and fails the build if
  # recall@10 drops below the threshold. Correctness regression, not a perf gate.
  #
  # recall-regression:
  #   runs-on: ubuntu-latest
  #   ...
