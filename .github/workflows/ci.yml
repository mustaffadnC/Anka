name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting RUSTFLAGS here. `-C target-cpu=native` would be wrong
  # (the runner is a different machine than the one benchmarks are measured on), and a
  # global `-D warnings` would also promote *dependency* warnings to errors. Warnings
  # are denied per-invocation on our own crates instead, via the clippy step below.

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Must match the `channel` in rust-toolchain.toml, otherwise the toolchain gets
      # installed twice: once by this action and once by rustup honouring that file.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Toolchain
        run: rustc -V && cargo -V && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  # Builds an index on real data and fails if recall@10 falls below the threshold. A correctness
  # gate, not a performance one: no target-cpu=native, and no timing is asserted, because the
  # runner is not the benchmark machine.
  #
  # The workspace tests already contain a deterministic recall check on synthetic data, which
  # needs no network. This job adds real vectors on top — siftsmall is 10 MB and cached, so the
  # download happens once per key.
  recall-regression:
    name: recall regression (siftsmall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Cache siftsmall
        id: dataset
        uses: actions/cache@v5
        with:
          path: ~/anka-datasets/siftsmall
          key: siftsmall-${{ hashFiles('scripts/checksums.txt') }}

      - name: Download siftsmall
        if: steps.dataset.outputs.cache-hit != 'true'
        run: ./scripts/download_datasets.sh siftsmall

      # `anka bench` carries the per-dataset recall target and exits non-zero when it is missed,
      # so the gate lives with the data rather than in a threshold repeated here.
      - name: Recall regression
        run: cargo run --release -p anka-cli -- bench siftsmall --ef 40 --k 10
