[package]
name = "anka-store"
description = "Snapshot, write-ahead log and crash recovery for Anka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anka-core.workspace = true
anka-index.workspace = true
bytemuck = "1.25.2"
crc32fast = "1.5.0"
memmap2 = "0.9.11"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3.27.0"

# The crash tests send a real SIGKILL. `Child::kill` sends SIGKILL too on Unix, but the test also
# needs to target a process it is deliberately not reaping first, so the syscall is used directly.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
